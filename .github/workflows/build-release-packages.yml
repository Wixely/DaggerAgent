name: Build Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  DOTNET_VERSION: 10.0.x

jobs:
  publish:
    name: Publish ${{ matrix.runtime_id }} ${{ matrix.package_type }}
    runs-on: ubuntu-latest
    # Credentials for the Wixely/acp-csharp GitHub Packages feed (see nuget.config).
    # Same-owner GITHUB_TOKEN can read the fork's package; nuget.config reads these env vars.
    env:
      GITHUB_PACKAGES_USER: ${{ github.actor }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_id: win-x64
            package_type: framework-dependent
            self_contained: false
          - runtime_id: linux-x64
            package_type: framework-dependent
            self_contained: false
          - runtime_id: win-x64
            package_type: self-contained
            self_contained: true
          - runtime_id: linux-x64
            package_type: self-contained
            self_contained: true

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Resolve build metadata
        shell: bash
        run: |
          set -euo pipefail
          project_name="${GITHUB_REPOSITORY#*/}"
          project_file="$(find . -path '*/bin/*' -prune -o -path '*/obj/*' -prune -o -name "${project_name}.csproj" -print | sort | head -n 1)"

          if [[ -z "${project_file}" ]]; then
            echo "Could not resolve project file for '${project_name}'." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            package_version="${GITHUB_REF_NAME}"
          else
            package_version="dev-${GITHUB_RUN_NUMBER}"
          fi

          echo "PROJECT_NAME=${project_name}" >> "$GITHUB_ENV"
          echo "PROJECT_FILE=${project_file}" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=${package_version}" >> "$GITHUB_ENV"
          echo "PACKAGE_BASENAME=${project_name}-${{ matrix.runtime_id }}-${{ matrix.package_type }}" >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_FILE }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_FILE }}" -c Release --no-restore

      - name: Publish
        run: >
          dotnet publish "${{ env.PROJECT_FILE }}"
          -c Release
          -r ${{ matrix.runtime_id }}
          --self-contained ${{ matrix.self_contained }}
          -o "publish/${{ matrix.runtime_id }}-${{ matrix.package_type }}"
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=${{ matrix.self_contained }}
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:IsTransformWebConfigDisabled=true
          -p:StaticWebAssetsEnabled=false
          -p:DebugType=none
          -p:DebugSymbols=false

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd "publish/${{ matrix.runtime_id }}-${{ matrix.package_type }}"
          zip -r "../../${PACKAGE_BASENAME}-${PACKAGE_VERSION}.zip" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_BASENAME }}
          path: ${{ env.PACKAGE_BASENAME }}-${{ env.PACKAGE_VERSION }}.zip
          if-no-files-found: error

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Compute image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The in-image `dotnet restore` needs the fork's package feed (nuget.config).
          # User is a plain build-arg; the token is a BuildKit secret so it isn't baked in.
          build-args: |
            GITHUB_PACKAGES_USER=${{ github.actor }}
          secrets: |
            github_packages_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish, docker]
    runs-on: ubuntu-latest

    steps:
      # Deliberately a plain checkout. Tweaking fetch-depth/fetch-tags to expose the tag
      # annotation does not work — see the release step below for why — so the notes are
      # read over the API instead and this job needs nothing from git.
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: ${{ github.event.repository.name }}-*

      - name: Show release assets
        shell: bash
        run: find release-assets -maxdepth 2 -type f | sort

      # Prefer the tag's own annotation as the release body. --generate-notes lists
      # merged PR titles, which say how the work arrived rather than what shipped:
      # v1.6.0 went out headed by a PR title written before most of its contents
      # existed. Falls back to generated notes for a lightweight tag, which carries
      # no message to read.
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi

          # Read the annotation over the API, never from the checkout. actions/checkout
          # resolves the ref to a commit and force-fetches it over refs/tags/<tag> —
          # "t [tag update] <sha> -> <tag>" in its log — so the local tag ref points at a
          # commit and the annotation is unreachable regardless of fetch-depth/fetch-tags.
          # Both earlier attempts died here: v1.7.0 got its commit message (gh
          # --notes-from-tag reads local git and exits 0 anyway), v1.7.1 got generated notes.
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          obj_type="$(jq -r '.object.type' <<<"${ref_json}")"
          obj_sha="$(jq -r '.object.sha' <<<"${ref_json}")"

          if [ "${obj_type}" = "tag" ]; then
            notes="${RUNNER_TEMP}/release-notes.md"
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${obj_sha}" --jq '.message' > "${notes}"
            echo "Annotated tag ${GITHUB_REF_NAME}: release body from its message ($(wc -c < "${notes}") bytes)."
            gh release create "${GITHUB_REF_NAME}" --notes-file "${notes}"
          else
            echo "${GITHUB_REF_NAME} is a lightweight tag (object type '${obj_type}'); generating notes."
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*/*.zip)
          if (( ${#assets[@]} == 0 )); then
            echo "No release ZIP assets found." >&2
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
